name: "fgc-payments-docker"
services:

  rabbitmq:

    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    networks:
      - fcg-network

  payments-db:
    image: mcr.microsoft.com/mssql/server:2025-latest

    container_name: fcg-payments-sql-db
    ports:
      - "1434:1433"

    deploy:
      resources:
        limits:
          memory: 1500M 
        reservations:
          memory: 1000M  
              
    environment:
      SA_PASSWORD: ${SQL_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"

    volumes:
      - payments-data:/var/opt/mssql
      
    restart: unless-stopped

    networks:
      - fcg-network

  payments-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fcg-payments-api

    ports:
      - "5003:8080"

    depends_on:
      - payments-db
      - rabbitmq

    deploy:
      resources:
        limits:
          memory: 512M      
        reservations:
          memory: 256M       

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      
      #ConnectionStrings
      ConnectionStrings__DefaultConnection: "Server=payments-db;Database=paymentso;User Id=sa;Password=Sql@123456789;TrustServerCertificate=True"

      # RabbitMQ
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__VirtualHost: "/"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"

    networks:
      - fcg-network

volumes:
  payments-data:


networks:
  fcg-network:
    external: true